name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oneclick-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment is waiting for repository secrets."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        with:
          node-version: 24
      - run: npm run check
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
      - name: Deploy Worker
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@e580a9c32a53a6e848aa1e55830f0cf77f8b8b95
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke production
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: npm run smoke:production
