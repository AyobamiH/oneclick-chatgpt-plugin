name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oneclick-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OC_SUPABASE_URL: ${{ secrets.ONECLICK_SUPABASE_URL }}
      OC_SUPABASE_KEY: ${{ secrets.ONECLICK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check deployment credentials
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment is waiting for repository secrets."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        with:
          node-version: 24
      - run: npm run check
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
      - name: Deploy Worker
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Configure optional One Click authentication
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.OC_SUPABASE_URL != '' && env.OC_SUPABASE_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("/tmp/oneclick-secrets.json", JSON.stringify({ONECLICK_SUPABASE_URL:process.env.OC_SUPABASE_URL,ONECLICK_SUPABASE_PUBLISHABLE_KEY:process.env.OC_SUPABASE_KEY}))'
          npx --yes wrangler@4.33.1 secret bulk /tmp/oneclick-secrets.json --name oneclick-chatgpt
      - name: Smoke production
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: npm run smoke:production
