name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oneclick-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require deployment credentials
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare deployment credentials are required for production pushes."
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm run check
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.33.1"
          command: deploy
      - name: Verify live privacy settings
        run: npm run verify:privacy
        env:
          ONECLICK_PRIVACY_EVIDENCE_PATH: artifacts/oneclick-privacy-settings.json
      - name: Smoke production
        run: npm run smoke:production
        env:
          ONECLICK_EVIDENCE_PATH: artifacts/oneclick-live-review.json
      - name: Preserve review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneclick-review-evidence-${{ github.sha }}
          path: artifacts/*.json
          retention-days: 30
          if-no-files-found: error
